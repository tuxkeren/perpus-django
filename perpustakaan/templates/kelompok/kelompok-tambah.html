{% extends 'base.html' %}

{% block content %}

    <center>
        <h1>Tambah Kelompok Buku</h1>
    </center>

    <div class="container">
        <div class= "row">
            <div class="col-md-4">
                {% if pesan %}
                    <div class="alert alert-success" role="alert">{{ pesan }}</div>
                {% endif %}
                <form  action="/tambah-kelompok/" method="POST">
                    {% csrf_token %}    
                    {{ form.as_p }}
            
                    <button type="submit" class="btn btn-primary">Simpan</button>
                    <a href="/kelompok" class="btn btn-secondary">Kembali</a>
                </form>
            </div>
        </div>
    </div>

{% endblock %}
